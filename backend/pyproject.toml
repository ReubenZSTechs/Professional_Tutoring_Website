[project]
name = "reuben-susanto-tutoring-backend"
version = "1.0.0"
description = "FastAPI + LangGraph backend: RAG chat assistant and contact form."
requires-python = ">=3.12"
# Keep identical to backend/requirements.txt (both are read by Vercel's Python build).
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "langgraph==1.2.20",
    "google-genai==3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "ruff>=0.17", "pip-audit>=2.7"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs real Gemini and Supabase credentials in .env"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]  # long attack strings and fixtures
"**/guardrails/injection.py" = ["E501"]  # one pattern per line reads better
