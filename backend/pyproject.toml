[project]
name = "reuben-susanto-tutoring-backend"
version = "1.0.0"
description = "FastAPI + LangGraph backend: RAG chat assistant and contact form."
requires-python = ">=3.12"
# Keep in sync with requirements.txt at the repo root (used by Vercel).
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "langgraph>=1.2",
    "google-genai>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "ruff>=0.17"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs real Gemini and Supabase credentials in .env"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults
